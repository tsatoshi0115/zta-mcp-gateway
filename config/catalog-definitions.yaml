version: "1.0"
catalogs:
  # ============================================================================
  # 購買・調達支出管理アーカイブデータベース (Procurement & Spend Analytics)
  # ============================================================================
  - id: "procurement_archive_analytics"
    name: "購買・調達支出管理アーカイブデータベース (archive-prod)"
    description: "企業の調達・見積依頼・発注・検収・請求支払締処理・承認履歴の統合アーカイブデータベース。サプライヤ別支出実績、部門別コストセンター分析、見積コスト削減効果、インボイス対応状況などを高精度に分析可能。"
    target_mcp: "aurora-mysql"
    target_tool: "run_query"
    required_roles: ["analyst", "admin"]

    # --- 1. データモデル (スキーマ定義) ---
    schema:
      tables:
        # --- 商談・発注・検収 (Opportunity & Order) ---
        - name: "SearchOpportunity"
          description: "発注・商談案件サマリ情報（案件ヘッダ）"
          primary_key: "SearchOpportunityID"
          columns: "SearchOpportunityID (BIGINT), OpportunityProjectNumber (VARCHAR: 案件管理番号), OpportunityProjectName (VARCHAR: 案件・発注名), CompanyGroupCode (VARCHAR), OrderApplyDate (DATETIME: 申請日), OrderDate (DATETIME: 発注日), OrderBuyerType (VARCHAR: 調達種別), OrderRequestCompany (VARCHAR: 申請企業名), OrderRequestDepartment (VARCHAR: 申請部門名), OrderRequestPerson (VARCHAR: 申請者名), OrderTotalAmount (DECIMAL: 発注合計金額), AcceptanceTotalAmount (DECIMAL: 検収合計金額)"
          relationships:
            - "JOIN SearchOpportunityDetail ON SearchOpportunity.SearchOpportunityID = SearchOpportunityDetail.SearchOpportunityID"

        - name: "SearchOpportunityDetail"
          description: "発注・商談明細（サプライヤ、カテゴリ、科目、検収日）"
          primary_key: "SearchOpportunityDetailID"
          columns: "SearchOpportunityDetailID (BIGINT), SearchOpportunityID (BIGINT, FK), OrderSupplierName (VARCHAR: 発注先サプライヤ名), OrderSupplierCd (VARCHAR: サプライヤコード), OrderAmount (DECIMAL: 発注金額), AcceptanceAmount (DECIMAL: 検収金額), OrderCategoryNameLarge (VARCHAR: 大カテゴリ), OrderCategoryNameMedium (VARCHAR: 中カテゴリ), OrderCategoryNameSmall (VARCHAR: 小カテゴリ), OrderCostCenter (VARCHAR: コストセンター名), OrderCostCenterCode (VARCHAR), OrderAccountSubjectName (VARCHAR: 勘定科目名), ReceiveDate (DATETIME: 納品日), AcceptanceDate (DATETIME: 検収日), CloseDate (DATETIME: 完了日)"
          relationships:
            - "JOIN SearchOpportunity ON SearchOpportunityDetail.SearchOpportunityID = SearchOpportunity.SearchOpportunityID"

        - name: "ArchiveOpportunity1"
          description: "発注・商談詳細トランザクション（品目・単価・数量・インボイス）"
          primary_key: "ArchiveOpportunityID"
          columns: "ArchiveOpportunityID (BIGINT), SearchOpportunityID (BIGINT, FK), ProjectNumber (VARCHAR: 案件番号), ProjectName (TEXT), SupplierCompanyName (VARCHAR: サプライヤ名), ItemName (TEXT: 品名), MakerItemNumber (TEXT: 型番), MakerName (TEXT: メーカー名), Spec (TEXT: 仕様), UnitCost (DECIMAL: 発注単価), OrderQuantity (INT: 発注数量), OrderAmount (DECIMAL: 発注金額), AcceptanceQuantity (DECIMAL: 検収数量), AcceptanceAmount (DECIMAL: 検収金額), AmountWithoutTax (DECIMAL: 税抜金額), AmountWithTax (DECIMAL: 税込金額), AmountTax (DECIMAL: 消費税額), Tax (DECIMAL: 税率), QualifiedInvoiceNumber (TEXT: 適格請求書発行事業者番号), DutyFreeDivision (INT: 免税区分)"
          relationships:
            - "JOIN SearchOpportunity ON ArchiveOpportunity1.SearchOpportunityID = SearchOpportunity.SearchOpportunityID"

        # --- 見積依頼・回答 (Estimate & Quotation) ---
        - name: "SearchEstimate"
          description: "見積案件サマリ（希望額 vs 採用額・採用サプライヤ）"
          primary_key: "SerachEstimateID"
          columns: "SerachEstimateID (BIGINT), EstimateProjectNumber (VARCHAR: 見積番号), EstimateProjectName (VARCHAR: 見積案件名), AdoptSupplierName (VARCHAR: 採用サプライヤ名), AdoptSupplierCode (VARCHAR), RequestDate (DATETIME: 見積依頼日), EstimateDate (DATETIME: 回答日), SelectedApprovalDate (DATETIME: 採用承認日), DesiredAmount (DECIMAL: 依頼希望金額), AdoptAmount (DECIMAL: 最終採用金額), EstimateCategoryNameLarge (VARCHAR), BuyerDepartment (VARCHAR: 調達担当部門), BuyerPerson (VARCHAR: 調達担当者), EstimateRequestCompany (VARCHAR: 依頼企業), EstimateRequestDepartment (VARCHAR: 依頼部門)"
          relationships:
            - "JOIN SearchEstimateDetail ON SearchEstimate.SerachEstimateID = SearchEstimateDetail.SearchEstimateID"
            - "JOIN ArchiveEstimate ON SearchEstimate.SerachEstimateID = ArchiveEstimate.SearchEstimateID"

        - name: "ArchiveEstimate"
          description: "見積依頼明細・サプライヤ回答・コスト削減明細"
          primary_key: "ArchiveEstimateID"
          columns: "ArchiveEstimateID (BIGINT), SearchEstimateID (BIGINT, FK), ProjectNumber (VARCHAR: 見積案件番号), ProjectName (TEXT), EstRequestItemName (TEXT: 依頼品目名), EstRequestQuantity (INT: 依頼数量), EstRequestDesiredUnitCost (DECIMAL: 希望単価), EstRequestTotalAmount (DECIMAL: 希望総額), AnsSupplierName (VARCHAR: 回答サプライヤ名), AnsItemName (TEXT: 回答品目名), AnsOfferUnitCost (DECIMAL: 提示単価), AnsAmount (DECIMAL: 回答金額), AdoptFlg (TINYINT: 採用フラグ 1=採用), AdoptSupplierName (VARCHAR: 採用サプライヤ), AdoptAmount (DECIMAL: 採用金額), OutgoSuppressionAmount (DECIMAL: 支出抑制/コスト削減額), RequestDate (DATETIME), EstResultFinalApprovalDate (DATETIME: 最終承認日)"
          relationships:
            - "JOIN SearchEstimate ON ArchiveEstimate.SearchEstimateID = SearchEstimate.SerachEstimateID"

        # --- 請求・支払締処理 (Payment & Closing) ---
        - name: "ArchivePaymentClosingHeader"
          description: "支払締ヘッダ（月次支払・税抜・税額・税込確定情報）"
          primary_key: "ArchivePaymentClosingHeaderID"
          columns: "ArchivePaymentClosingHeaderID (BIGINT), PaymentNo (TEXT: 支払番号), CompanyGroupName (TEXT), BuyerCompanyName (TEXT: 買手企業名), SupplierCompanyName (TEXT: サプライヤ名), TargetMonthly (TEXT: 対象年月 YYYY/MM), ClosingDate (DATETIME: 締日), PayClosingDate (DATETIME: 支払日), TotalAmountWithoutTax (DECIMAL: 税抜合計金額), TotalAmountTax (DECIMAL: 消費税額合計), TotalAmountWithTax (DECIMAL: 税込合計金額), TotalQuantityPayment (INT: 支払件数), QualifiedInvoiceNumber (TEXT: インボイス登録番号)"
          relationships:
            - "JOIN ArchivePaymentClosingDetail ON ArchivePaymentClosingHeader.ArchivePaymentClosingHeaderID = ArchivePaymentClosingDetail.ArchivePaymentClosingHeaderID"
            - "JOIN ArchivePaymentClosingHeaderTax ON ArchivePaymentClosingHeader.ArchivePaymentClosingHeaderID = ArchivePaymentClosingHeaderTax.ArchivePaymentClosingHeaderID"

        - name: "ArchivePaymentClosingDetail"
          description: "支払締明細（個別検収レコード紐付け・品目・金額）"
          primary_key: "ArchivePaymentClosingDetailID"
          columns: "ArchivePaymentClosingDetailID (BIGINT), ArchivePaymentClosingHeaderID (BIGINT, FK), OrderNo (TEXT: 発注番号), ItemName (TEXT: 品名), AcceptanceUnitPrice (DECIMAL: 検収単価), AcceptanceQuantity (DECIMAL: 検収数量), AcceptanceAmount (DECIMAL: 検収金額), AcceptanceDate (DATETIME: 検収日), UnitPrice (DECIMAL: 請求単価), AmountWithoutTax (DECIMAL: 請求税抜額), AmountTax (DECIMAL: 消費税額), AmountWithTax (DECIMAL: 請求税込額), RequestOrganizationName (TEXT: 依頼組織名), RequesterName (TEXT: 依頼者名), TargetMonthly (TEXT: 対象月)"
          relationships:
            - "JOIN ArchivePaymentClosingHeader ON ArchivePaymentClosingDetail.ArchivePaymentClosingHeaderID = ArchivePaymentClosingHeader.ArchivePaymentClosingHeaderID"

        - name: "ArchivePaymentClosingHeaderTax"
          description: "支払締 税率別消費税集計（10%対象額、8%対象額等）"
          primary_key: "ArchivePaymentClosingHeaderTaxID"
          columns: "ArchivePaymentClosingHeaderTaxID (BIGINT), ArchivePaymentClosingHeaderID (BIGINT, FK), PaymentNo (TEXT), TaxRate (DECIMAL: 適用税率 0.10 / 0.08), SumTotalPayAmountWithoutTax (DECIMAL: 税抜額), TaxAmount (DECIMAL: 消費税額), SumTotalPayAmountWithTax (DECIMAL: 税込支払合計)"
          relationships:
            - "JOIN ArchivePaymentClosingHeader ON ArchivePaymentClosingHeaderTax.ArchivePaymentClosingHeaderID = ArchivePaymentClosingHeader.ArchivePaymentClosingHeaderID"

        # --- 承認履歴 (Approval History) ---
        - name: "ApprovalHistory"
          description: "プロジェクト・案件承認履歴ログ"
          primary_key: "ID"
          columns: "ID (BIGINT), ArchiveId (BIGINT), ProjectNumber (VARCHAR: 案件番号), ApprovalType (VARCHAR: 見積/発注/支払等の承認種別), ApprovalKbn (VARCHAR: 承認/却下/差戻区分), UserName (VARCHAR: 承認者氏名), CompanyName (VARCHAR: 会社名), OrganizationName (VARCHAR: 所属組織名), ExecuteDate (DATETIME: 承認実行日時), MessageInfo (VARCHAR: 承認者コメント)"
          relationships:
            - "JOIN SearchOpportunity ON ApprovalHistory.ProjectNumber = SearchOpportunity.OpportunityProjectNumber"

      query_rules:
        - "クエリは必ず SELECT 文のみ発行してください（SHOW/DESCRIBEは不要です）。"
        - "高速な全体集計・サマリ分析には、まず SearchOpportunity, SearchEstimate, ArchivePaymentClosingHeader を主軸に使用してください。"
        - "サプライヤ別や品目別の詳細な金額分析を行う場合は、SearchOpportunityDetail または ArchivePaymentClosingDetail を JOIN してください。"
        - "年度や月次での集計を行う際は、OrderDate（発注日）、AcceptanceDate（検収日）、または TargetMonthly（対象月 YYYY/MM）で絞り込み・GROUP BY してください。"
        - "金額フィールド（OrderAmount, AcceptanceAmount, TotalAmountWithoutTax 等）は DECIMAL 型のため、SUM(), AVG(), ROUND() 等の集計関数を適切に適用してください。"

      recommended_queries:
        - title: "サプライヤ別 年間発注・検収実績ランキング TOP 10"
          sql: |
            SELECT 
              d.OrderSupplierCd AS supplier_code,
              d.OrderSupplierName AS supplier_name,
              COUNT(DISTINCT s.OpportunityProjectNumber) AS project_count,
              SUM(d.OrderAmount) AS total_order_amount,
              SUM(d.AcceptanceAmount) AS total_acceptance_amount
            FROM SearchOpportunity s
            JOIN SearchOpportunityDetail d ON s.SearchOpportunityID = d.SearchOpportunityID
            WHERE s.OrderDate >= '2025-01-01'
            GROUP BY d.OrderSupplierCd, d.OrderSupplierName
            ORDER BY total_order_amount DESC
            LIMIT 10;

        - title: "月次支払締推移（税抜総額・消費税額・税込支払総額）"
          sql: |
            SELECT 
              TargetMonthly AS target_month,
              COUNT(ArchivePaymentClosingHeaderID) AS closing_count,
              SUM(TotalAmountWithoutTax) AS total_without_tax,
              SUM(TotalAmountTax) AS total_tax,
              SUM(TotalAmountWithTax) AS total_with_tax
            FROM ArchivePaymentClosingHeader
            WHERE TargetMonthly IS NOT NULL AND TargetMonthly != ''
            GROUP BY TargetMonthly
            ORDER BY TargetMonthly DESC
            LIMIT 12;

        - title: "部門別・コストセンター別の購買支出実績"
          sql: |
            SELECT 
              s.OrderRequestDepartment AS department_name,
              d.OrderCostCenter AS cost_center_name,
              COUNT(DISTINCT s.OpportunityProjectNumber) AS order_count,
              SUM(d.OrderAmount) AS total_spend_amount
            FROM SearchOpportunity s
            JOIN SearchOpportunityDetail d ON s.SearchOpportunityID = d.SearchOpportunityID
            GROUP BY s.OrderRequestDepartment, d.OrderCostCenter
            ORDER BY total_spend_amount DESC
            LIMIT 15;

        - title: "見積コスト削減・支出抑制実績ランキング（希望額 vs 採用額）"
          sql: |
            SELECT 
              EstimateProjectNumber AS estimate_no,
              EstimateProjectName AS project_name,
              AdoptSupplierName AS adopted_supplier,
              DesiredAmount AS desired_amount,
              AdoptAmount AS adopted_amount,
              (DesiredAmount - AdoptAmount) AS cost_reduction_amount,
              ROUND(((DesiredAmount - AdoptAmount) / DesiredAmount) * 100, 2) AS reduction_rate_percent
            FROM SearchEstimate
            WHERE DesiredAmount > AdoptAmount AND DesiredAmount > 0
            ORDER BY cost_reduction_amount DESC
            LIMIT 10;

        - title: "案件別 承認ステータス・承認履歴追跡"
          sql: |
            SELECT 
              ProjectNumber AS project_number,
              ApprovalType AS approval_type,
              ApprovalKbn AS approval_status,
              UserName AS approver_name,
              OrganizationName AS approver_department,
              ExecuteDate AS approval_datetime,
              MessageInfo AS approval_comment
            FROM ApprovalHistory
            WHERE ProjectNumber = 'PRJ-2025-001'
            ORDER BY ExecuteDate ASC;

    # --- 2. GenUI (推奨画面設計図) ---
    gen_ui:
      recommended_layout: "ProcurementSpendDashboard"
      framework: "TailwindCSS + Chart.js"
      color_palette:
        primary: "#2563eb"         # プロキュアメントブルー
        secondary: "#64748b"       # スレートグレー
        accent_positive: "#059669" # コスト削減・検収済グリーン
        accent_warning: "#d97706"  # 承認待ち・進行中アンバー
        card_bg: "#0f172a"         # スレートダーク背景
      
      components:
        - type: "stat_grid"
          items:
            - label: "年間総発注金額"
              field: "total_order_amount"
              format: "¥{val:currency}"
              subtext: "発注承認完了ベース"
            - label: "検収済金額"
              field: "total_acceptance_amount"
              format: "¥{val:currency}"
              subtext: "検収受入完了"
            - label: "コスト削減総額"
              field: "total_cost_reduction"
              format: "¥{val:currency}"
              subtext: "見積希望額 vs 採用額差分"
            - label: "取引サプライヤ数"
              field: "active_suppliers_count"
              format: "{val}社"
              subtext: "当期実績"

        - type: "chart"
          chart_type: "bar"
          title: "月次購買支出および支払推移 (税抜額 vs 税込額)"
          x_axis: "target_month"
          y_axis: "amount"
          series:
            - key: "total_without_tax"
              label: "税抜金額"
              color: "#3b82f6"
            - key: "total_with_tax"
              label: "税込金額"
              color: "#10b981"

        - type: "chart"
          chart_type: "doughnut"
          title: "サプライヤ別 購買シェア TOP 5"
          labels_field: "supplier_name"
          data_field: "total_order_amount"

        - type: "table"
          title: "サプライヤ別 発注・検収実績詳細"
          columns:
            - { label: "サプライヤコード", key: "supplier_code" }
            - { label: "サプライヤ名", key: "supplier_name" }
            - { label: "案件数", key: "project_count" }
            - { label: "発注総額", key: "total_order_amount", format: "currency" }
            - { label: "検収総額", key: "total_acceptance_amount", format: "currency" }
            - { label: "検収率", key: "acceptance_rate", highlight: true }
